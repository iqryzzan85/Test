<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой бизнес-сайт</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <img src="images/iq.png" alt="Макет из Figma">
   <div class="services-container">

    <div class="service-card">
      <h2>Создание сайтов</h2>
      <p>Современный сайт для вашего бизнеса.</p>
      <button>Подробнее</button>
    </div>

    <div class="service-card">
      <h2>Дизайн</h2>
      <p>Стильный и удобный дизайн для вашей компании.</p>
      <button>Подробнее</button>
    </div>

    <div class="service-card featured">
      <h2>Продвижение</h2>
      <p>Поможем привлечь новых клиентов через интернет.</p>
      <button>Подробнее</button>
    </div>
  </div>

   <section class="contact">
  <h2>Оставьте заявку</h2>
  <p>Мы свяжемся с вами и обсудим ваш проект.</p>

  <form id="contact-form">
    <input
      type="text"
      id="name"
      placeholder="Ваше имя"
      required
    >

    <input
      type="tel"
      id="phone"
      placeholder="Ваш телефон"
      required
    >

    <button type="submit">Отправить заявку</button>
  </form>

  <p id="form-message"></p>
</section>

</body>
</html>
